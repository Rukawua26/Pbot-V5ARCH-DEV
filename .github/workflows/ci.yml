name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, freeze/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency consistency check
        run: |
          python -m pip check

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q main.py core

      - name: Requirements lock sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          required = {line.strip() for line in Path('requirements.txt').read_text().splitlines() if line.strip() and not line.strip().startswith('#')}
          print(f"requirements_entries={len(required)}")
          assert 'ta' in required
          PY

      - name: Smoke modular imports
        run: |
          bash scripts/smoke_modular_imports.sh

      - name: Guardrail pass silenciosos en core
        run: |
          python tools/check_no_silent_pass.py

      - name: Regression contracts (arquitectura)
        run: |
          python tools/regression_contracts.py

      - name: Regression unit tests (runtime flows)
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Temporal invariance stress tests
        run: |
          python -m unittest tests/test_temporal_invariance.py
