name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, freeze/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas rich python-dotenv requests scikit-learn websocket-client websockets
          pip install pandas_ta || pip install pandas-ta

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q main.py core

      - name: Smoke modular imports
        run: |
          bash scripts/smoke_modular_imports.sh

      - name: Guardrail pass silenciosos en core
        run: |
          python tools/check_no_silent_pass.py
