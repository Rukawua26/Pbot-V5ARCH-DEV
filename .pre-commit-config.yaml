repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--select, E,F,I,W,UP, --fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: compileall
        name: Python compileall
        entry: python -m compileall -q
        language: system
        files: \.py$
        types: [python]
        pass_filenames: false
        args: [main.py, core, tools]

      - id: silent-pass
        name: Check silent pass
        entry: python tools/check_no_silent_pass.py
        language: system
        files: ^core/
        pass_filenames: false
